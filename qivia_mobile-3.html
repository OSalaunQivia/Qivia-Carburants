<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Qivia — Mobile</title>
<script>
/* Même contrôle d'accès que les autres pages.
   La session est partagée avec les iframes (même origine), donc une fois
   authentifié via index.html, les pages prospect/carte ne redirigeront pas. */
if(sessionStorage.getItem('qivia_auth')!=='1'){
  window.location.replace('index.html');
}
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0D1117;--green:#00C48C;--muted:#6E7A8A;--border:rgba(255,255,255,.1);}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;width:100%;overflow:hidden;font-family:'Inter',sans-serif;background:var(--navy);}
body{display:flex;flex-direction:column;}

/* HEADER */
#mhdr{
  background:var(--navy);height:48px;flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;border-bottom:1px solid var(--border);
  padding-top:env(safe-area-inset-top);
  height:calc(48px + env(safe-area-inset-top));
}
.mlogo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.98rem;color:#fff;}
.mlogo-q{width:26px;height:26px;border-radius:7px;background:var(--green);display:flex;align-items:center;justify-content:center;color:var(--navy);font-size:.72rem;font-weight:800;}
.mlogo-g{color:var(--green);}
#mlogout{background:none;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.55);border-radius:8px;padding:5px 11px;font-size:.74rem;font-weight:600;cursor:pointer;font-family:inherit;}
#mlogout:active{background:rgba(255,255,255,.08);}

/* ZONE IFRAMES */
#mstage{flex:1;position:relative;min-height:0;background:#E8EAED;}
.mframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#E8EAED;}
.mframe.active{display:block;}

/* Petit chargeur affiché avant que l'iframe ne soit prête */
.mloader{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--navy);z-index:5;}
.mloader.show{display:flex;}
.mloader .lq{width:46px;height:46px;border-radius:12px;background:var(--green);display:flex;align-items:center;justify-content:center;color:var(--navy);font-size:1.3rem;font-weight:800;}
.mloader .lt{color:#fff;font-size:.9rem;font-weight:600;}
.mloader .lbar{width:180px;height:3px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden;}
.mloader .lbar i{display:block;width:40%;height:100%;background:var(--green);border-radius:2px;animation:mbar 1.1s ease-in-out infinite alternate;}
@keyframes mbar{from{margin-left:0}to{margin-left:60%}}

/* BARRE D'ONGLETS BAS */
#mnav{
  flex-shrink:0;display:flex;background:var(--navy);
  border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom);
}
.mtab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:9px 0 8px;background:none;border:0;cursor:pointer;font-family:inherit;
  color:rgba(255,255,255,.45);font-size:.66rem;font-weight:600;
  border-top:2px solid transparent;margin-top:-1px;
}
.mtab .ic{font-size:1.25rem;line-height:1;}
.mtab.active{color:var(--green);border-top-color:var(--green);}
.mtab:active{background:rgba(255,255,255,.04);}
</style>
</head>
<body>

<header id="mhdr">
  <div class="mlogo"><span class="mlogo-q">Q</span><span>Qivia<span class="mlogo-g">.</span></span></div>
  <button id="mlogout" onclick="mLogout()">Déconnexion</button>
</header>

<div id="mstage">
  <!-- Chargeurs -->
  <div class="mloader show" id="loader-prospect">
    <div class="lq">Q</div><div class="lt">Chargement de la synthèse…</div>
    <div class="lbar"><i></i></div>
  </div>
  <div class="mloader" id="loader-carte">
    <div class="lq">Q</div><div class="lt">Chargement de la carte…</div>
    <div class="lbar"><i></i></div>
  </div>

  <!-- Les deux pages existantes, inchangées -->
  <iframe class="mframe active" id="frame-prospect" title="Synthèse prospect"></iframe>
  <iframe class="mframe" id="frame-carte" title="Carte des stations"></iframe>
</div>

<nav id="mnav">
  <button class="mtab active" id="tab-prospect" onclick="mShow('prospect')">
    <span class="ic">📊</span><span>Synthèse</span>
  </button>
  <button class="mtab" id="tab-carte" onclick="mShow('carte')">
    <span class="ic">🗺️</span><span>Carte</span>
  </button>
</nav>

<script>
/* ───────────────────────────────────────────────────────────
   CSS mobile injecté DANS chaque page (même origine requise).
   On ne touche ni au HTML, ni au JS, ni aux données des pages :
   on ajoute seulement une feuille de style adaptée au téléphone.
   En cas d'échec (ex: file://), la page garde son propre responsive.
   ─────────────────────────────────────────────────────────── */

const CSS_PROSPECT = `
  html,body{overflow:auto !important;height:auto !important;}
  body{font-size:13px !important;}
  /* La nav interne fait doublon avec les onglets du bas → masquée */
  .hdr{height:auto !important;flex-wrap:wrap !important;gap:8px !important;padding:8px 12px !important;}
  .hdr .nav-wrap{display:none !important;}
  .hdr > div:first-child{flex:1 1 auto;}
  .hdr-right{gap:14px !important;flex-wrap:wrap !important;row-gap:6px !important;}
  .hdr-stat-val{font-size:.9rem !important;}
  /* Barre de filtres : passe à la ligne, compacte */
  .fbar{flex-wrap:wrap !important;gap:6px 8px !important;padding:8px 12px !important;}
  .fbar-label{font-size:.6rem !important;}
  select.fs,.multi-btn{font-size:.78rem !important;padding:6px 9px !important;}
  .multi-btn{min-width:120px !important;}
  .fsep{display:none !important;}
  /* Grille : une seule colonne, blocs empilés */
  .grid{grid-template-columns:1fr !important;grid-template-rows:auto !important;height:auto !important;padding:12px !important;gap:14px !important;}
  .row{display:flex !important;flex-direction:column !important;gap:14px !important;}
  .row-right{display:flex !important;flex-direction:column !important;gap:14px !important;height:auto !important;}
  .cell{min-height:300px !important;width:100% !important;overflow:visible !important;}
  .chart-area{min-height:240px !important;}
  /* Bloc 4 simulateur : entrées au-dessus du résultat */
  .sim-layout{grid-template-columns:1fr !important;gap:12px !important;}
  .summary-grid{grid-template-columns:1fr 1fr !important;}
  .stations-row{grid-template-columns:1fr 1fr 1fr !important;}
`;

const CSS_CARTE = `
  html,body{height:100% !important;overflow:hidden !important;}
  /* La nav interne fait doublon avec les onglets du bas → masquée */
  #topbar .nav-wrap{display:none !important;}
  #topbar{flex-wrap:wrap !important;gap:6px !important;padding:6px 10px !important;align-items:center !important;max-height:48vh;overflow-y:auto;}
  #topbar > div:first-child{flex:1 1 auto;display:flex;align-items:center;justify-content:flex-end;}
  /* Onglets réseaux : rangée défilable horizontalement */
  .net-tabs{order:1;width:100%;display:flex !important;flex-wrap:nowrap !important;gap:6px !important;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;}
  .net-tab{flex:0 0 auto;font-size:.72rem !important;padding:6px 9px !important;white-space:nowrap;}
  /* Filtres : pleine largeur sous les onglets */
  .filters{order:2;width:100%;margin-left:0 !important;display:flex !important;flex-wrap:wrap !important;gap:6px !important;align-items:center !important;}
  .search-wrap{flex:1 1 100% !important;}
  #search-input{width:100% !important;}
  #autocomplete{width:100% !important;}
  .zone-type-sel,select.fsel{flex:1 1 auto;font-size:.76rem !important;}
  .filter-sep{display:none !important;}
  /* Marques : rangée défilable */
  #brand-pills{order:3;width:100%;display:flex !important;flex-wrap:nowrap !important;overflow-x:auto;-webkit-overflow-scrolling:touch;gap:5px !important;padding-bottom:2px;}
  .brand-pill{flex:0 0 auto;white-space:nowrap;}
  /* Compteurs + import : dernière rangée */
  .counter-wrap{order:4;}
  .csv-btn{order:5;font-size:.72rem !important;}
  /* La carte occupe le maximum de hauteur restante */
  #map{flex:1 1 auto !important;min-height:50vh !important;}
  /* Panneau itinéraire un peu plus à gauche pour ne pas masquer le zoom */
  #route-panel,.route-control{left:10px !important;}
  .route-control{width:min(300px,calc(100vw - 24px)) !important;}
  /* Popups : largeur adaptée au téléphone */
  .leaflet-popup-content{min-width:200px !important;max-width:78vw !important;}
`;

function injectCSS(frame, css){
  try{
    const doc = frame.contentDocument || frame.contentWindow.document;
    if(!doc) return;
    if(doc.getElementById('__qivia_mobile_css')) return;
    const st = doc.createElement('style');
    st.id = '__qivia_mobile_css';
    st.textContent = css;
    (doc.head || doc.documentElement).appendChild(st);
  }catch(e){
    /* Origine différente (ex: ouverture en file://) :
       on laisse la page utiliser son propre responsive. */
    console.warn('Injection CSS mobile impossible (origine ?) :', e);
  }
}

/* ── Gestion des onglets + chargement paresseux des iframes ── */
const SOURCES = { prospect:'qivia_prospect.html', carte:'qivia_carte.html' };
const loaded = { prospect:false, carte:false };
let current = 'prospect';

function loadFrame(which){
  if(loaded[which]) return;
  loaded[which] = true;
  const frame  = document.getElementById('frame-'+which);
  const loader = document.getElementById('loader-'+which);
  frame.addEventListener('load', () => {
    injectCSS(frame, which === 'prospect' ? CSS_PROSPECT : CSS_CARTE);
    if(loader) loader.classList.remove('show');
    /* Pour Leaflet : recalcule la taille de la carte une fois visible */
    if(which === 'carte'){
      setTimeout(() => { try{ frame.contentWindow.dispatchEvent(new Event('resize')); }catch(e){} }, 250);
    }
  });
  frame.src = SOURCES[which];
}

function mShow(which){
  current = which;
  ['prospect','carte'].forEach(w => {
    document.getElementById('frame-'+w).classList.toggle('active', w === which);
    document.getElementById('tab-'+w).classList.toggle('active', w === which);
  });
  loadFrame(which);
  /* Carte déjà chargée : forcer un recalcul d'affichage Leaflet */
  if(which === 'carte' && loaded.carte){
    const f = document.getElementById('frame-carte');
    setTimeout(() => { try{ f.contentWindow.dispatchEvent(new Event('resize')); }catch(e){} }, 120);
  }
}

function mLogout(){
  sessionStorage.removeItem('qivia_auth');
  window.location.replace('index.html');
}

/* Démarrage : on charge la synthèse (onglet par défaut) */
loadFrame('prospect');
</script>
</body>
</html>
