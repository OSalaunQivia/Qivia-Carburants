<!DOCTYPE html>
<html lang="fr">
<head>
<script>
if(sessionStorage.getItem('qivia_auth')!=='1'){window.location.href='index.html';}
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Qivia Mobile</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">


<style>
/* ── BASE ───────────────────────────────────────────── */
:root{
  --bg:#F0F2F5;--white:#FFF;--text:#0D1117;--muted:#6E7A8A;
  --border:#DDE1E7;--green:#00C48C;--gdk:#00956A;--gbg:#E6FBF4;
  --navy:#0D1117;--red:#F04E37;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{height:100%;height:-webkit-fill-available;}
body{height:100%;height:-webkit-fill-available;overflow:hidden;font-family:'Inter',sans-serif;font-size:14px;background:var(--bg);}

/* ── LAYOUT ─────────────────────────────────────────── */
.app{display:flex;flex-direction:column;height:100%;height:-webkit-fill-available;}
.topbar{
  background:var(--navy);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;height:50px;flex-shrink:0;
}
.topbar-logo{display:flex;align-items:center;gap:8px;color:#fff;font-weight:800;font-size:.9rem;}
.topbar-logo img{width:30px;height:30px;border-radius:8px;object-fit:cover;}
.topbar-actions{display:flex;align-items:center;gap:8px;}
.filter-btn{
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);
  color:#fff;border-radius:8px;padding:6px 12px;
  font-size:.75rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;
  display:flex;align-items:center;gap:5px;transition:background .15s;
}
.filter-btn.active{background:rgba(0,196,140,.25);border-color:var(--green);color:var(--green);}
.logout-btn{background:none;border:none;color:rgba(255,255,255,.5);font-size:.75rem;cursor:pointer;font-family:'Inter',sans-serif;}

/* ── FILTER PANEL ───────────────────────────────────── */
.filter-panel{
  background:var(--navy);
  border-bottom:1px solid rgba(255,255,255,.1);
  padding:0 14px;
  max-height:0;overflow:hidden;
  transition:max-height .25s ease,padding .25s ease;
}
.filter-panel.open{max-height:200px;padding:12px 14px;}
.filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.frow{display:flex;flex-direction:column;gap:3px;}
.frow label{font-size:.6rem;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.07em;}
.frow select{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
  color:#fff;border-radius:7px;padding:7px 10px;
  font-family:'Inter',sans-serif;font-size:.78rem;font-weight:500;
  outline:none;cursor:pointer;
}
.frow select option{background:#1e293b;color:#fff;}
.filter-apply{
  grid-column:1/-1;margin-top:4px;
  background:var(--green);border:none;border-radius:8px;
  color:var(--navy);font-weight:700;font-size:.8rem;
  padding:9px;cursor:pointer;font-family:'Inter',sans-serif;
}

/* ── MAIN CONTENT ───────────────────────────────────── */
.content{flex:1;overflow:hidden;position:relative;}
.section{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  opacity:0;pointer-events:none;
  transition:opacity .2s;
}
.section.active{opacity:1;pointer-events:all;}

/* ── CHARTS SECTION ─────────────────────────────────── */
.charts-scroll{flex:1;overflow-y:auto;padding:12px 12px 4px;display:flex;flex-direction:column;gap:12px;}
.charts-scroll::-webkit-scrollbar{display:none;}
.card{background:var(--white);border-radius:14px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.card-title{display:flex;align-items:center;gap:7px;margin-bottom:12px;}
.card-num{
  width:22px;height:22px;border-radius:6px;
  background:var(--navy);color:#fff;
  font-size:.62rem;font-weight:800;
  display:flex;align-items:center;justify-content:center;
}
.card-title h2{font-size:.82rem;font-weight:700;color:var(--text);}
.chart-wrap{position:relative;height:220px;}

/* bloc 3 stations */
.st-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.st-box{border-radius:9px;padding:9px 11px;border:1.5px solid transparent;}
.st-box.qivia{background:var(--gbg);border-color:var(--green);}
.st-box.comp{background:#F8F9FB;border-color:var(--border);}
.st-box.extra{background:#EEF3FD;border-color:#90B8F8;}
.st-lbl{font-size:.58rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);}
.st-val{font-size:1.1rem;font-weight:800;margin-top:2px;line-height:1;}
.st-box.qivia .st-val{color:var(--gdk);}
.st-box.extra .st-val{color:#2D6BE4;}
.st-sub{font-size:.6rem;color:var(--muted);margin-top:2px;}
.chart-wrap-sm{position:relative;height:180px;margin-top:6px;}



/* ── BOTTOM NAV ─────────────────────────────────────── */
.bottom-nav{
  background:var(--white);
  border-top:1px solid var(--border);
  display:flex;
  flex-shrink:0;
  padding-bottom:max(env(safe-area-inset-bottom,0px),8px);
  padding-top:4px;
  min-height:58px;
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;
  gap:3px;padding:10px 0;cursor:pointer;
  color:var(--muted);font-size:.62rem;font-weight:600;
  text-transform:uppercase;letter-spacing:.04em;
  border-top:2px solid transparent;transition:color .15s,border-color .15s;
}
.nav-item.active{color:var(--navy);border-color:var(--navy);}
.nav-icon{font-size:1.2rem;line-height:1;}

/* ── HEADER STATS ───────────────────────────────────── */
.hero-stats{
  display:flex;gap:10px;padding:10px 12px 0;
}
.hero-stat{
  flex:1;background:var(--white);border-radius:10px;
  padding:8px 10px;border:1px solid var(--border);
}
.hero-val{font-size:.95rem;font-weight:800;color:var(--green);}
.hero-lbl{font-size:.55rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}










</style>
</head>
<body>
<div class="app">

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="topbar-logo">
      <div style="width:30px;height:30px;border-radius:8px;background:var(--green);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.85rem;color:var(--navy)">Q</div>
      <span>Qivia</span>
    </div>
    <div class="topbar-actions">
      <button class="filter-btn" id="filter-toggle-btn" onclick="toggleFilters()">⚙ Filtres</button>
      <button class="logout-btn" onclick="logout()">Déconnexion</button>
    </div>
  </div>

  <!-- FILTER PANEL (masqué par défaut) -->
  <div class="filter-panel" id="filter-panel">
    <div class="filter-grid">
      <div class="frow">
        <label>Carburant</label>
        <select id="gf-fuel" onchange="onFilter()">
          <option value="gazole_prix">Gazole</option>
          <option value="sp95_prix">SP95</option>
          <option value="e10_prix">E10</option>
          <option value="sp98_prix">SP98</option>
          <option value="e85_prix">E85</option>
          <option value="gplc_prix">GPLc</option>
        </select>
      </div>
      <div class="frow">
        <label>Période</label>
        <select id="gf-period" onchange="onFilter()">
          <option value="7">7 derniers jours</option>
          <option value="14">14 jours</option>
          <option value="30">1 mois</option>
          <option value="90">3 mois</option>
          <option value="all">Tout</option>
        </select>
      </div>
      <div class="frow">
        <label>Zone</label>
        <select id="gf-zone" onchange="onFilter()">
          <option value="">France entière</option>
        </select>
      </div>
      <div class="frow">
        <label>Enseigne</label>
        <select id="gf-brand" onchange="onFilter()">
          <option value="">Toutes</option>
        </select>
      </div>
    </div>
  </div>

  <!-- HERO STATS (section graphiques uniquement) -->
  <div class="hero-stats" id="hero-stats">
    <div class="hero-stat">
      <div class="hero-val" id="hero-stations">—</div>
      <div class="hero-lbl">Stations Qivia</div>
    </div>
    <div class="hero-stat">
      <div class="hero-val" id="hero-saving">—</div>
      <div class="hero-lbl">Éco. GMS vs Pétr.</div>
    </div>
    <div class="hero-stat">
      <div class="hero-val">100%</div>
      <div class="hero-lbl">Couverture</div>
    </div>
  </div>

  <!-- CONTENU PRINCIPAL -->
  <div class="content">

    <!-- SECTION GRAPHIQUES -->
    <div class="section active" id="sec-charts">
      <div class="charts-scroll">

        <!-- BLOC 1 : Évolution prix -->
        <div class="card">
          <div class="card-title">
            <div class="card-num">1</div>
            <h2>Évolution des prix par réseau</h2>
          </div>
          <div class="chart-wrap"><canvas id="ch-b1"></canvas></div>
        </div>

        <!-- BLOC 2 : Prix moyen par enseigne -->
        <div class="card">
          <div class="card-title">
            <div class="card-num">2</div>
            <h2>Prix moyen par enseigne</h2>
          </div>
          <div class="chart-wrap"><canvas id="ch-b2"></canvas></div>
        </div>

        <!-- BLOC 3 : Stations -->
        <div class="card" style="padding-bottom:6px">
          <div class="card-title">
            <div class="card-num">3</div>
            <h2>Stations Qivia vs réseau actuel</h2>
          </div>
          <div class="st-row">
            <div class="st-box qivia">
              <div class="st-lbl">Réseau Qivia</div>
              <div class="st-val" id="b3-qivia-count">—</div>
              <div class="st-sub" id="b3-qivia-sub">France entière</div>
            </div>
            <div class="st-box comp">
              <div class="st-lbl" id="b3-comp-label">Réseau actuel</div>
              <div class="st-val" id="b3-comp-count">—</div>
              <div class="st-sub" id="b3-comp-sub">Sélectionnez une enseigne</div>
            </div>
          </div>
          <div id="b3-extra-box" style="display:none;margin-bottom:8px">
            <div class="st-box extra" style="display:inline-block;min-width:120px">
              <div class="st-lbl">Stations suppl.</div>
              <div class="st-val" id="b3-extra-count">—</div>
              <div class="st-sub" id="b3-extra-sub"></div>
            </div>
          </div>
          <div class="chart-wrap-sm"><canvas id="ch-b3"></canvas></div>
        </div>

        <div style="height:8px"></div>
      </div>
    </div>

    <!-- SECTION CARTE : iframe vers qivia_carte.html -->
    <div class="section" id="sec-map" style="display:none;opacity:0;pointer-events:none">
      <iframe id="carte-iframe"
        src=""
        style="flex:1;border:none;width:100%;height:100%;"
        allow="geolocation">
      </iframe>
    </div>

  </div>

  <!-- BOTTOM NAV -->
  <div class="bottom-nav">
    <div class="nav-item active" id="nav-charts" onclick="switchTab('charts')">
      <span class="nav-icon">📊</span>
      <span>Graphiques</span>
    </div>
    <div class="nav-item" id="nav-map" onclick="switchTab('map')">
      <span class="nav-icon">🗺</span>
      <span>Carte</span>
    </div>
  </div>

</div>

<!-- CHART.JS CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>

<script>
// ── AUTH & NAV ────────────────────────────────────────────────
function logout(){sessionStorage.removeItem('qivia_auth');window.location.href='index.html';}

let currentTab = 'charts';

function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  document.getElementById('nav-'+tab).classList.add('active');

  const secCharts = document.getElementById('sec-charts');
  const secMap = document.getElementById('sec-map');
  const heroStats = document.getElementById('hero-stats');

  if(tab==='charts'){
    secCharts.style.display='';
    secCharts.classList.add('active');
    secMap.style.display='none';
    secMap.style.opacity='0';
    secMap.style.pointerEvents='none';
    secMap.classList.remove('active');
    heroStats.style.display='flex';
    // Filtres: carburant+période pertinent pour graphiques
  } else {
    secCharts.classList.remove('active');
    secMap.style.display='flex';
    secMap.style.flexDirection='column';
    setTimeout(()=>{
      secMap.style.opacity='1';
      secMap.style.pointerEvents='all';
      secMap.classList.add('active');
    },10);
    heroStats.style.display='none';
    const iframe = document.getElementById('carte-iframe');
    if(!iframe.src || iframe.src === window.location.href) {
      iframe.src = './qivia_carte.html';
    }
  }
}

function toggleFilters(){
  const panel = document.getElementById('filter-panel');
  const btn = document.getElementById('filter-toggle-btn');
  const isOpen = panel.classList.toggle('open');
  btn.classList.toggle('active', isOpen);
  btn.textContent = isOpen ? '✕ Fermer' : '⚙ Filtres';
}

// ── DATA & CHARTS ─────────────────────────────────────────────
const GMS=['Leclerc','Intermarché','Carrefour','Super U','Auchan','Netto','Casino'];
const PETRO=['TotalEnergies','Total','Esso','BP','Avia','Eni/Agip','Dyneff','Shell','Elan'];
const COLORS={
  'Leclerc':'#A8D5BA','Intermarché':'#B5EAD7','Carrefour':'#AED6F1',
  'Super U':'#A9DEF9','Auchan':'#CAFFBF','Netto':'#FDFFB6','Casino':'#C7F2A4',
  'TotalEnergies':'#FFADAD','Esso':'#FFB5A7','BP':'#FFC8DD',
  'Avia':'#FFCFD2','Eni/Agip':'#E8C1F4','Dyneff':'#D4A5A5',
  'Shell':'#FFDDD2','Elan':'#F4ACB7','Autre':'#E0E0E0'
};
const FL={gazole_prix:'Gazole',sp95_prix:'SP95',e10_prix:'E10',sp98_prix:'SP98',e85_prix:'E85',gplc_prix:'GPLc'};

function gc(b){return COLORS[b]||'#E0E0E0';}
const CB={
  responsive:true,maintainAspectRatio:false,
  plugins:{
    legend:{labels:{color:'#6E7A8A',font:{family:'Inter',size:10},boxWidth:8,padding:8}},
    tooltip:{backgroundColor:'#0D1117',titleColor:'#fff',bodyColor:'rgba(255,255,255,.7)',
      titleFont:{family:'Inter',weight:'700',size:11},bodyFont:{family:'Inter',size:10},
      padding:8,cornerRadius:8}
  },
  scales:{
    x:{ticks:{color:'#6E7A8A',font:{family:'Inter',size:9},maxRotation:45},grid:{color:'#EAECEF'}},
    y:{ticks:{color:'#6E7A8A',font:{family:'Inter',size:9}},grid:{color:'#EAECEF'}}
  }
};

let DATA=null, charts={};
let GF={fuel:'gazole_prix',period:'7',brand:'',zone:''};

function onFilter(){
  GF.fuel=document.getElementById('gf-fuel').value;
  GF.period=document.getElementById('gf-period').value;
  GF.brand=document.getElementById('gf-brand').value;
  GF.zone=document.getElementById('gf-zone').value;
  buildAll();
}

function getFilteredDates(){
  const all=DATA.meta.dates;
  if(GF.period==='all')return all;
  return all.slice(-parseInt(GF.period));
}

function avg(arr){const v=arr.filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b)/v.length:null;}
function fmtd(d){const p=d.slice(5).split('-');return p[1]+'/'+p[0];}
function dc(id){if(charts[id]){charts[id].destroy();delete charts[id];}}

async function boot(){
  try{
    const r=await fetch('./qivia_data.json');if(!r.ok)throw new Error('HTTP '+r.status);
    DATA=await r.json();
    // Normaliser Total → TotalEnergies
    DATA.meta.brands=DATA.meta.brands.map(b=>b==='Total'?'TotalEnergies':b);
    DATA.brand_daily=DATA.brand_daily.map(r=>({...r,brand:r.brand==='Total'?'TotalEnergies':r.brand}));
    if(DATA.brand_region_daily)DATA.brand_region_daily=DATA.brand_region_daily.map(r=>({...r,brand:r.brand==='Total'?'TotalEnergies':r.brand}));
    DATA.stations=DATA.stations.map(s=>({...s,brand:s.brand==='Total'?'TotalEnergies':s.brand}));

    document.getElementById('hero-stations').textContent=DATA.meta.n_stations.toLocaleString('fr-FR');

    // Remplir sélects brands
    let brands=(DATA.meta.brands||[]).filter(b=>b&&b!=='Autre'&&b!=='nan'&&b!=='null');
    // Si meta.brands vide, déduire depuis brand_daily
    if(!brands.length&&DATA.brand_daily){
      const bset=new Set(DATA.brand_daily.map(r=>r.brand).filter(b=>b&&b!=='Autre'&&b!=='nan'));
      brands=[...bset].sort();
    }
    const sb=document.getElementById('gf-brand');
    // Vider les options existantes sauf "Toutes"
    while(sb.options.length>1)sb.remove(1);
    brands.forEach(b=>sb.add(new Option(b,b)));

    // Remplir régions
    let regions=DATA.meta.regions||[];
    if(!regions.length&&DATA.brand_region_daily){
      const rset=new Set(DATA.brand_region_daily.map(r=>r.region).filter(Boolean));
      regions=[...rset].sort();
    }
    const sz=document.getElementById('gf-zone');
    while(sz.options.length>1)sz.remove(1);
    regions.forEach(r=>sz.add(new Option(r,r)));

    buildAll();
  }catch(e){console.error('boot:',e);}
}

function getBrandDaily(){
  if(GF.zone&&DATA.brand_region_daily){
    return DATA.brand_region_daily.filter(r=>r.region===GF.zone);
  }
  return DATA.brand_daily;
}

function buildAll(){
  calcHeroSaving();buildBloc1();buildBloc2();buildBloc3();
}

function calcHeroSaving(){
  const fuel=GF.fuel,dates=getFilteredDates(),bd=getBrandDaily();
  const gv=bd.filter(r=>GMS.includes(r.brand)&&dates.includes(r.date)&&r[fuel]!=null).map(r=>r[fuel]);
  const pv=bd.filter(r=>PETRO.includes(r.brand)&&dates.includes(r.date)&&r[fuel]!=null).map(r=>r[fuel]);
  if(!gv.length||!pv.length){document.getElementById('hero-saving').textContent='—';return;}
  const diff=(pv.reduce((a,b)=>a+b)/pv.length)-(gv.reduce((a,b)=>a+b)/gv.length);
  document.getElementById('hero-saving').textContent=diff>0?(diff*100).toFixed(1)+'c/L':'0c/L';
}

function buildBloc1(){
  const fuel=GF.fuel,dates=getFilteredDates(),brands=DATA.meta.brands.filter(b=>b!=='Autre'&&b!=='nan');
  const bd=getBrandDaily(),bdMap={};
  bd.forEach(r=>{if(!bdMap[r.brand])bdMap[r.brand]={};bdMap[r.brand][r.date]=r[fuel];});
  // Afficher seulement les dates récentes sur mobile (max 30 labels)
  const step=Math.max(1,Math.floor(dates.length/20));
  const datesDisplay=dates.filter((_,i)=>i%step===0||i===dates.length-1);
  dc('b1');
  charts['b1']=new Chart(document.getElementById('ch-b1'),{
    type:'line',
    data:{
      labels:datesDisplay.map(d=>fmtd(d)),
      datasets:brands.map(b=>({
        label:b,borderColor:gc(b),backgroundColor:'transparent',
        data:datesDisplay.map(d=>bdMap[b]&&bdMap[b][d]!=null?bdMap[b][d]:null),
        tension:.35,pointRadius:0,pointHoverRadius:4,borderWidth:1.5,
        fill:false,spanGaps:true
      }))
    },
    options:{...CB,interaction:{mode:'index',intersect:false}}
  });
}

function buildBloc2(){
  const fuel=GF.fuel,dates=getFilteredDates(),brands=DATA.meta.brands.filter(b=>b!=='Autre'&&b!=='nan');
  const bd=getBrandDaily();
  const avgs=brands.map(b=>{
    const vals=bd.filter(r=>r.brand===b&&dates.includes(r.date)&&r[fuel]!=null).map(r=>r[fuel]);
    return{b,v:vals.length?vals.reduce((a,c)=>a+c)/vals.length:null};
  }).filter(x=>x.v!=null).sort((a,b)=>a.v-b.v);
  const minVal=avgs.length?Math.min(...avgs.map(x=>x.v)):1.5;
  dc('b2');
  charts['b2']=new Chart(document.getElementById('ch-b2'),{
    type:'bar',
    data:{
      labels:avgs.map(x=>x.b.length>10?x.b.slice(0,9)+'…':x.b),
      datasets:[{label:FL[fuel]+' €/L',data:avgs.map(x=>parseFloat(x.v.toFixed(4))),
        backgroundColor:avgs.map(x=>gc(x.b)),borderRadius:5,borderSkipped:false}]
    },
    options:{...CB,plugins:{...CB.plugins,legend:{display:false}},
      scales:{x:{...CB.scales.x,ticks:{...CB.scales.x.ticks,font:{size:9}}},
        y:{...CB.scales.y,min:Math.min(1.5,minVal-0.02),
          ticks:{...CB.scales.y.ticks,callback:v=>v.toFixed(3)+' €'}}}}
  });
}

function buildBloc3(){
  const brand=GF.brand;
  let allSt=DATA.stations||[];
  let filtSt=GF.zone?allSt.filter(s=>s.region===GF.zone):allSt;
  const qCount=!GF.zone?DATA.meta.n_stations:filtSt.length;
  document.getElementById('b3-qivia-count').textContent=qCount.toLocaleString('fr-FR');
  document.getElementById('b3-qivia-sub').textContent=GF.zone||'France entière';
  if(brand){
    const cCount=filtSt.filter(s=>s.brand===brand).length;
    document.getElementById('b3-comp-label').textContent=brand;
    document.getElementById('b3-comp-count').textContent=cCount.toLocaleString('fr-FR');
    document.getElementById('b3-comp-sub').textContent=brand+(GF.zone?' dans '+GF.zone:' en France');
    const diff=qCount-cCount,pct=cCount>0?Math.round(diff/cCount*100):0;
    document.getElementById('b3-extra-count').textContent='+'+diff.toLocaleString('fr-FR');
    document.getElementById('b3-extra-sub').textContent=pct+'× plus de choix';
    document.getElementById('b3-extra-box').style.display='';
  }else{
    document.getElementById('b3-comp-count').textContent='—';
    document.getElementById('b3-extra-box').style.display='none';
  }
  const bc={};filtSt.forEach(s=>{if(s.brand&&s.brand!=='Autre'&&s.brand!=='nan')bc[s.brand]=(bc[s.brand]||0)+1;});
  const sorted=Object.entries(bc).sort((a,b)=>b[1]-a[1]).slice(0,8);
  dc('b3');
  charts['b3']=new Chart(document.getElementById('ch-b3'),{
    type:'bar',
    data:{labels:sorted.map(x=>x[0].length>9?x[0].slice(0,8)+'…':x[0]),
      datasets:[{label:'Stations',data:sorted.map(x=>x[1]),
        backgroundColor:sorted.map(x=>gc(x[0])),borderRadius:5}]},
    options:{...CB,plugins:{...CB.plugins,legend:{display:false}}}
  });
}

// ── BOOT ──────────────────────────────────────────────────────
boot();
</script>
