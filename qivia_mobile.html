if(sessionStorage.getItem('qivia_auth')!=='1'){ window.location.replace('index.html'); }

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0D1117;--green:#00C48C;--muted:#6E7A8A;--border:rgba(255,255,255,.1);}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;width:100%;overflow:hidden;font-family:'Inter',sans-serif;background:var(--navy);}
body{display:flex;flex-direction:column;}
#mhdr{background:var(--navy);flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 14px;border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top);height:calc(50px + env(safe-area-inset-top));}
.mlogo{display:flex;align-items:center;gap:9px;}
.mlogo img{height:30px;width:30px;border-radius:50%;object-fit:cover;display:block;}
.mlogo span{font-weight:800;font-size:1rem;color:#fff;}
.mlogo .g{color:var(--green);}
.mhdr-right{display:flex;align-items:center;gap:8px;}
.mbtn{background:none;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.6);border-radius:8px;padding:6px 11px;font-size:.74rem;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px;}
.mbtn:active{background:rgba(255,255,255,.08);}
#mfilters.active{background:rgba(0,196,140,.16);border-color:var(--green);color:var(--green);}
#mstage{flex:1;position:relative;min-height:0;background:#E8EAED;}
.mframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#E8EAED;}
.mframe.active{display:block;}
.mloader{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--navy);z-index:5;}
.mloader.show{display:flex;}
.mloader .lq{width:46px;height:46px;border-radius:12px;background:var(--green);display:flex;align-items:center;justify-content:center;color:var(--navy);font-size:1.3rem;font-weight:800;}
.mloader .lt{color:#fff;font-size:.9rem;font-weight:600;}
.mloader .lbar{width:180px;height:3px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden;}
.mloader .lbar i{display:block;width:40%;height:100%;background:var(--green);border-radius:2px;animation:mbar 1.1s ease-in-out infinite alternate;}
@keyframes mbar{from{margin-left:0}to{margin-left:60%}}
#mnav{flex-shrink:0;display:flex;background:var(--navy);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom);}
.mtab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:9px 0 8px;background:none;border:0;cursor:pointer;font-family:inherit;color:rgba(255,255,255,.45);font-size:.66rem;font-weight:600;border-top:2px solid transparent;margin-top:-1px;}
.mtab .ic{font-size:1.25rem;line-height:1;}
.mtab.active{color:var(--green);border-top-color:var(--green);}
.mtab:active{background:rgba(255,255,255,.04);}
</style>
</head>

<script>
/* La coque affiche les PAGES D'ORIGINE en direct (qivia_prospect.html /
   qivia_carte.html) : aucune donnée n'est copiée, les mises à jour
   quotidiennes apparaissent automatiquement.
   On se contente d'ajouter, au chargement de chaque page (même origine) :
     - une feuille de style mobile (affichage seulement)
     - pour la synthèse : un petit script qui borne l'axe Y du Bloc 2.
   Rien n'est écrit dans les fichiers d'origine. */

/* Pages d'origine, jamais modifiées */
const SOURCES = { prospect:'qivia_prospect.html', carte:'qivia_carte.html' };
const loaded  = { prospect:false, carte:false };
const filtersOpen = { prospect:false, carte:false };   // masqués par défaut
let current = 'prospect';

const CSS_PROSPECT = `
  html,body{overflow:auto !important;height:auto !important;}
  body{font-size:13px !important;}
  .hdr{display:none !important;}                       /* en-tête interne (sans logo) retiré */
  .fbar{display:none !important;}
  body.qf-open .fbar{display:grid !important;grid-template-columns:1fr 1fr;gap:10px !important;padding:12px !important;background:#fff !important;border-bottom:1px solid #DDE1E7;position:sticky;top:0;z-index:60;}
  body.qf-open .fbar > .fbar-label{grid-column:1 / -1;margin-bottom:-4px;font-size:.62rem !important;color:#6E7A8A;}
  body.qf-open .fbar select.fs,body.qf-open .fbar .multi-btn{width:100% !important;height:38px !important;font-size:.82rem !important;padding:0 12px !important;border-radius:9px !important;}
  body.qf-open .fbar .multi-btn{text-align:left;display:flex;align-items:center;}
  .fsep{display:none !important;}
  .grid{grid-template-columns:1fr !important;grid-template-rows:auto !important;height:auto !important;padding:12px !important;gap:14px !important;}
  .row{display:flex !important;flex-direction:column !important;gap:14px !important;}
  .row-right{display:none !important;}                 /* blocs 4 et 5 retirés */
  .cell{min-height:300px !important;width:100% !important;overflow:visible !important;}
  .chart-area{min-height:250px !important;}
  .stations-row{grid-template-columns:1fr 1fr 1fr !important;}
`;

const CSS_CARTE = `
  html,body{height:100% !important;overflow:hidden !important;}
  #topbar > div:first-child{display:none !important;}  /* logo/nav/déconnexion en double retirés */
  .csv-btn{display:none !important;}                   /* import d'agences retiré */
  .counter-wrap .counter:nth-child(2){display:none !important;}  /* compteur agences retiré */
  #topbar{display:none !important;}
  body.qf-open #topbar{display:flex !important;flex-wrap:wrap !important;gap:8px !important;padding:10px !important;align-items:stretch !important;max-height:52vh;overflow-y:auto;}
  body.qf-open .net-tabs{order:1;width:100%;display:flex !important;flex-wrap:nowrap !important;gap:6px !important;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;}
  body.qf-open .net-tab{flex:0 0 auto;height:34px;font-size:.74rem !important;padding:0 11px !important;display:flex;align-items:center;gap:5px;white-space:nowrap;border-radius:9px;}
  body.qf-open .filters{order:2;width:100%;margin-left:0 !important;display:grid !important;grid-template-columns:1fr 1fr;gap:8px !important;align-items:stretch !important;}
  body.qf-open .search-wrap{grid-column:1 / -1;}
  body.qf-open #search-input{width:100% !important;height:38px !important;border-radius:9px !important;}
  body.qf-open #autocomplete{width:100% !important;}
  body.qf-open .zone-type-sel,body.qf-open select.fsel{width:100% !important;height:38px !important;font-size:.8rem !important;border-radius:9px !important;}
  body.qf-open .zone-multi-wrap{width:100%;}
  body.qf-open .zone-multi-btn{width:100% !important;height:38px !important;border-radius:9px !important;}
  .filter-sep{display:none !important;}
  body.qf-open #brand-pills{order:3;width:100%;display:flex !important;flex-wrap:nowrap !important;overflow-x:auto;-webkit-overflow-scrolling:touch;gap:5px !important;padding-bottom:2px;}
  body.qf-open .brand-pill{flex:0 0 auto;height:34px;white-space:nowrap;border-radius:9px;}
  body.qf-open .counter-wrap{order:4;}
  #map{flex:1 1 auto !important;min-height:62vh !important;}
  #route-panel,.route-control{left:10px !important;}
  .route-control{width:min(300px,calc(100vw - 24px)) !important;}
  .leaflet-popup-content{min-width:200px !important;max-width:78vw !important;}
`;

/* Code injecté DANS la page synthèse (s'exécute dans SON contexte, donc voit
   `charts`, `DATA`, `buildBloc2`, `buildAll`). Borne l'axe Y du Bloc 2 et
   retire le sélecteur TTC/HT. Ne touche pas aux données. */
const PATCH_PROSPECT = `
(function(){
  if(window.__qiviaB2) return; window.__qiviaB2 = true;
  /* Retrait propre du sélecteur TTC / HT (et de son séparateur) */
  try{
    var tt = document.getElementById('ttc-toggle');
    if(tt){
      var wrap = tt.parentElement;
      var sep  = wrap && wrap.previousElementSibling;
      if(sep && sep.classList && sep.classList.contains('fsep')) sep.remove();
      if(wrap) wrap.remove();
    }
  }catch(e){}
  /* Axe Y du Bloc 2 : du 10 cts inférieur au 10 cts supérieur des prix tracés */
  if(typeof buildBloc2 === 'function'){
    var orig = buildBloc2;
    buildBloc2 = function(){
      orig.apply(this, arguments);
      try{
        var ch = charts['b2']; if(!ch) return;
        var mn = Infinity, mx = -Infinity;
        ch.data.datasets.forEach(function(d){ (d.data||[]).forEach(function(v){
          if(v != null && !isNaN(v)){ if(v < mn) mn = v; if(v > mx) mx = v; }
        });});
        if(mn === Infinity) return;
        ch.options.scales.y.min = Math.floor(mn * 10) / 10;
        ch.options.scales.y.max = Math.ceil(mx * 10) / 10;
        ch.update('none');
      }catch(e){}
    };
  }
  /* Si les données sont déjà chargées, on redessine tout de suite */
  try{ if(typeof DATA !== 'undefined' && DATA && typeof buildAll === 'function') buildAll(); }catch(e){}
})();
`;

function injectCSS(frame, css){
  try{
    var doc = frame.contentDocument || frame.contentWindow.document;
    if(!doc || doc.getElementById('__qivia_mobile_css')) return;
    var st = doc.createElement('style');
    st.id = '__qivia_mobile_css'; st.textContent = css;
    (doc.head || doc.documentElement).appendChild(st);
  }catch(e){ console.warn('CSS mobile non injecté (origine ?) :', e); }
}
function injectScript(frame, code){
  try{
    var doc = frame.contentDocument || frame.contentWindow.document;
    if(!doc) return;
    var s = doc.createElement('script');
    s.textContent = code;
    (doc.body || doc.documentElement).appendChild(s);
  }catch(e){ console.warn('Script mobile non injecté (origine ?) :', e); }
}

function applyFilters(which){
  var f = document.getElementById('frame-'+which);
  try{ var d = f.contentDocument; if(d && d.body) d.body.classList.toggle('qf-open', filtersOpen[which]); }catch(e){}
  if(which === 'carte') setTimeout(function(){ try{ f.contentWindow.dispatchEvent(new Event('resize')); }catch(e){} }, 80);
}
function syncFilterBtn(){ document.getElementById('mfilters').classList.toggle('active', filtersOpen[current]); }
function mToggleFilters(){ filtersOpen[current] = !filtersOpen[current]; applyFilters(current); syncFilterBtn(); }

function loadFrame(which){
  if(loaded[which]) return;
  loaded[which] = true;
  var frame  = document.getElementById('frame-'+which);
  var loader = document.getElementById('loader-'+which);
  frame.addEventListener('load', function(){
    injectCSS(frame, which === 'prospect' ? CSS_PROSPECT : CSS_CARTE);
    if(which === 'prospect') injectScript(frame, PATCH_PROSPECT);
    applyFilters(which);
    if(loader) loader.classList.remove('show');
    if(which === 'carte') setTimeout(function(){ try{ frame.contentWindow.dispatchEvent(new Event('resize')); }catch(e){} }, 250);
  });
  frame.src = SOURCES[which];
}
function mShow(which){
  current = which;
  ['prospect','carte'].forEach(function(w){
    document.getElementById('frame-'+w).classList.toggle('active', w === which);
    document.getElementById('tab-'+w).classList.toggle('active', w === which);
  });
  loadFrame(which);
  syncFilterBtn();
  if(which === 'carte' && loaded.carte){
    var f = document.getElementById('frame-carte');
    setTimeout(function(){ try{ f.contentWindow.dispatchEvent(new Event('resize')); }catch(e){} }, 120);
  }
}
function mLogout(){ sessionStorage.removeItem('qivia_auth'); window.location.replace('index.html'); }

loadFrame('prospect');
syncFilterBtn();
</script>
</body>
</html>
